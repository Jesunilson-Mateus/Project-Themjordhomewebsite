<div class="wrap" style="padding: 60px 20px;">
  <div id="successMessage" style="display:none; text-align: center; padding: 40px 20px; background: #e8f5e9; border-radius: 8px; margin-bottom: 40px;">
    <h2 style="margin: 0 0 15px 0; color: #2e7d32;" data-i18n="review.thankYou">Obrigado pela sua avaliação!</h2>
    <p style="opacity: 0.8; margin: 0;" data-i18n="review.submitted">A sua avaliação foi submetida com sucesso e será revisada em breve.</p>
    <a href="index.html" class="cta-btn" style="margin-top: 20px;" data-i18n="review.backHome">← Voltar à página inicial</a>
  </div>

  <div id="reviewForm" style="max-width: 600px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 data-i18n="review.title" style="margin: 0 0 10px 0;">Deixe a sua avaliação</h1>
      <p id="propertyInfo" style="opacity: 0.7; margin: 0; font-size: 14px;"></p>
    </div>

    <form id="leaveReviewFormElement" style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Rating -->
      <div>
        <label style="display: block; margin-bottom: 10px; font-weight: 500;" data-i18n="review.rating">Como foi a sua estadia?</label>
        <div style="display: flex; gap: 15px; font-size: 32px;">
          <button type="button" class="star-btn" data-rating="1" style="background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;">★</button>
          <button type="button" class="star-btn" data-rating="2" style="background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;">★</button>
          <button type="button" class="star-btn" data-rating="3" style="background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;">★</button>
          <button type="button" class="star-btn" data-rating="4" style="background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;">★</button>
          <button type="button" class="star-btn" data-rating="5" style="background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;">★</button>
        </div>
        <input type="hidden" name="rating" id="ratingInput" required>
      </div>

      <!-- Review Title -->
      <div>
        <label for="reviewTitle" style="display: block; margin-bottom: 8px; font-weight: 500;" data-i18n="review.title_label">Título da avaliação</label>
        <input type="text" id="reviewTitle" name="title" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px;" placeholder="Ex: Estadia maravilhosa!">
      </div>

      <!-- Review Text -->
      <div>
        <label for="reviewText" style="display: block; margin-bottom: 8px; font-weight: 500;" data-i18n="review.text_label">Conte-nos mais sobre a sua experiência</label>
        <textarea id="reviewText" name="text" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px; min-height: 120px; resize: vertical;" placeholder="Descreva o que mais gostou durante a sua estadia..."></textarea>
      </div>

      <!-- Visitor Name -->
      <div>
        <label for="visitorName" style="display: block; margin-bottom: 8px; font-weight: 500;" data-i18n="review.name">Seu nome</label>
        <input type="text" id="visitorName" name="visitorName" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px;">
      </div>

      <!-- Visitor Country -->
      <div>
        <label for="visitorCountry" style="display: block; margin-bottom: 8px; font-weight: 500;" data-i18n="review.country">País</label>
        <input type="text" id="visitorCountry" name="country" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px;">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="cta-btn" style="margin-top: 10px;" data-i18n="review.submit">Enviar avaliação</button>
    </form>
  </div>
</div>
